<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weide – Sheep Herding</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="fonts.css" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #142016; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas {
      display: block;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // Load the tuning (config.js), the recorded sounds, the sounds (sound.js) and then the game (game.js), always the newest
    // versions (avoids the browser using an old cached copy).
    for (const file of ['config.js', 'soundeffects/sounds.js', 'sound.js', 'game.js']) {
      const js = document.createElement('script');
      js.src = file + '?v=' + Date.now();
      js.async = false;               // keep the order: config first
      document.body.appendChild(js);
    }
  </script>
</body>
</html>
